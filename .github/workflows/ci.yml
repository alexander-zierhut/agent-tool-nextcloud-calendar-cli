name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Hermetic tier — no backend, no account, no network. Guards every PR.
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[test]'
      - run: python -m pytest -m "not integration" -q

  # Integration tier: the real binary against Nextcloud 35 + Mailpit, booted here.
  # NEXTCLOUDCALENDAR_REQUIRE_INTEGRATION=1 makes an unreachable stack FAIL instead of skip,
  # so a silently skipped live tier can never look green.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Boot Nextcloud + Mailpit and seed users
        run: |
          docker compose up -d
          ./scripts/seed.sh
      - run: pip install -e '.[test]'
      - name: Integration tests (mailbox asserted)
        env:
          NEXTCLOUDCALENDAR_REQUIRE_INTEGRATION: "1"
        run: python -m pytest -m integration -q -rs
      - name: Server log on failure
        if: failure()
        run: docker compose exec -T nextcloud tail -n 200 /var/www/html/data/nextcloud.log || true

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[build]' build
      - run: python -m build && ls -l dist
      - name: Install the wheel into a clean venv and smoke-test
        run: |
          # A clean venv, because `pip install -e .` in the job venv would make a
          # broken wheel look installable.
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/nextcloud-calendar --version
      - name: Build the single-file binary
        run: python scripts/build_binary.py
      - name: Smoke-test the binary
        run: ./dist/nextcloud-calendar --version
      # The guide is what an agent runs FIRST, with no config and no token. Prove
      # it in the shipped artifact, not just in pytest.
      - name: The guide must work with no config, no token, no HOME
        run: env -i PATH=/usr/bin:/bin HOME=/nonexistent ./dist/nextcloud-calendar guide > /dev/null

  # Generated docs can never drift: regenerate, then fail if anything changed.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Regenerate docs/COMMANDS.md
        run: python scripts/gen_docs.py
      - name: Fail if the committed docs are stale
        run: |
          # `add -N` registers any brand-new file with the index so `git diff`
          # sees it. Without it an entirely uncommitted docs/COMMANDS.md is
          # untracked, diffs clean, and this check passes while shipping no docs.
          git add -N docs/
          git diff --exit-code docs/ || {
            echo "::error::docs/COMMANDS.md is out of date — run: python scripts/gen_docs.py"
            exit 1
          }
