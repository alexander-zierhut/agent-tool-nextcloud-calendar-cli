[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-tool-nextcloud-calendar-cli"
dynamic = ["version"]
description = "Agent-ready command-line interface for Nextcloud calendars (CalDAV) — move, extend, cancel and answer appointments quietly, and repair recurring meetings that show twice or vanished. Installs the `nextcloud-calendar` command."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zierhut IT" }, { name = "Alexander Zierhut" }]
keywords = [
    "nextcloud", "caldav", "calendar", "icalendar", "itip", "thunderbird",
    "cli", "command-line", "ai-agent", "llm", "automation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Utilities",
]
dependencies = [
    "agent-tool-shared-cli>=0.1.4,<0.2",
    "typer>=0.12",
    "httpx>=0.27",
    "keyring>=25",
    "rich>=13",
    "icalendar>=6.1",
    "recurring-ical-events>=3.3",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-timeout>=2.3"]
build = ["pyinstaller>=6"]

[project.urls]
Homepage = "https://github.com/alexander-zierhut/agent-tool-nextcloud-calendar-cli"
Repository = "https://github.com/alexander-zierhut/agent-tool-nextcloud-calendar-cli"
Issues = "https://github.com/alexander-zierhut/agent-tool-nextcloud-calendar-cli/issues"
Changelog = "https://github.com/alexander-zierhut/agent-tool-nextcloud-calendar-cli/releases"

[project.scripts]
# Not `nextcloud` (the desktop sync client's binary) and not `ncal` (BSD calendar).
nextcloud-calendar = "nextcloudcalendar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "nextcloudcalendar.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "integration: talks to the local Nextcloud + Mailpit stack (docker compose up -d)",
]
timeout = 180
